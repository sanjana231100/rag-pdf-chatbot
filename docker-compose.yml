version: "3.9"

services:
  api:
    build: .
    container_name: rag-api
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - chroma_data:/home/user/chroma_db
      - chroma_kb:/home/user/chroma_kb
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    container_name: rag-app
    ports:
      - "7860:7860"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - chroma_data:/home/user/chroma_db
      - chroma_kb:/home/user/chroma_kb
    command: streamlit run app.py --server.port=7860 --server.address=0.0.0.0
    depends_on:
      api:
        condition: service_healthy

volumes:
  chroma_data:
  chroma_kb: